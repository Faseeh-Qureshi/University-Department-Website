name: CD - Deploy to Development

on:
  push:
    branches:
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-dev:
    name: Deploy to Development Environment
    runs-on: ubuntu-latest
    environment: development
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Render (Development)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEV_RENDER_SERVICE_ID: ${{ secrets.DEV_RENDER_SERVICE_ID }}
        run: |
          echo "Triggering Render deploy for development service..."
          curl --no-buffer -X POST "https://api.render.com/deploy/srv-${DEV_RENDER_SERVICE_ID}?key=${RENDER_API_KEY}"

      - name: Verify deployment
        run: |
          echo "Development deployment initiated"
          echo "Website URL: ${{ secrets.DEV_WEBSITE_URL }}"

      - name: Notify deployment status
        if: always()
        run: echo "Development deployment completed for commit ${{ github.sha }}"

name: CD - Deploy to Production

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Render (Production)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PROD_RENDER_SERVICE_ID: ${{ secrets.PROD_RENDER_SERVICE_ID }}
        run: |
          echo "Triggering Render deploy for production service..."
          curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.render.com/v1/services/${PROD_RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Verify production deployment
        run: |
          echo "Production deployment initiated"
          echo "Website URL: ${{ secrets.PROD_WEBSITE_URL }}"
          sleep 30
          curl -f ${{ secrets.PROD_WEBSITE_URL }}/index.html || exit 1

      - name: Notify deployment success
        run: echo "Production deployment completed successfully for commit ${{ github.sha }}"

      - name: Alert on failure
        if: failure()
        run: echo "Production deployment failed. Please investigate immediately!"

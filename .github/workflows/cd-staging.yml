name: CD - Deploy to Staging/QA

on:
  push:
    branches:
      - 'release/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-staging:
    name: Deploy to Staging/QA Environment
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Render (Staging)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          STAGING_RENDER_SERVICE_ID: ${{ secrets.STAGING_RENDER_SERVICE_ID }}
        run: |
          echo "Triggering Render deploy for staging service..."
          curl --no-buffer -X POST "https://api.render.com/deploy/srv-${STAGING_RENDER_SERVICE_ID}?key=${RENDER_API_KEY}"

      - name: Verify deployment
        run: |
          echo "Staging deployment initiated"
          echo "Website URL: ${{ secrets.STAGING_WEBSITE_URL }}"

      - name: Run smoke tests
        run: |
          echo "Running basic smoke tests on staging environment"
          curl -f ${{ secrets.STAGING_WEBSITE_URL }}/index.html || exit 1

      - name: Notify deployment status
        if: always()
        run: echo "Staging deployment completed for release branch"
